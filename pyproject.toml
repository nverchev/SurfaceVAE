[project]
name = "SurfaceVAE"
version = "1.1"
description = "Variational Auto-Encoder for 3D surface meshes using fixed-graph spectral operators"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "drytorch>=0.1.0rc8",
    "dotenv>=0.9.9",
    "hydra-core>=1.3.2",
    "numpy>=2.3.5",
    "scipy>=1.15.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "requests>=2.28.1",
    "torch>=2.7.0",
    "torcheval>=0.0.7",
    "torchmetrics>=1.0.3",
    "typing-extensions>=4.15.0",
    "scikit-learn>=1.8.0",
    "tqdm>=4.66.5",
    "trimesh>=4.12.2",
    "h5py>=3.16.0",
    "tensorboard>=2.20.0",
    "fvcore>=0.1.5.post20221221",
]

[project.optional-dependencies]
track_all = [
    "tensorboard>=2.20.0",
    "wandb>=0.23.1",
    "sqlalchemy>=2.0.0",
    "tqdm",
]
finetune = ["optuna>=4.6.0", "plotly>=5.20.0"]
visualize = ["pyvista>=0.46.4", "seaborn>=0.13.2"]

[dependency-groups]
dev = ["basedpyright>=1.37.1", "pre-commit>=4.5.1", "ruff>=0.14.11"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportPrivateImportUsage = false
exclude = ["reference"]
