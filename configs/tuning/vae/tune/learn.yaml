study_name:
  vae_learn

n_trials: 100

params:
  train.learn.learning_rate:
    suggest: suggest_float
    settings:
      low: 1e-03
      high: 5e-03
      log: true

  train.learn.weight_decay:
    suggest: suggest_float
    settings:
      low: 1e-06
      high: 1e-03
      log: true

  train.batch_size:
    suggest: suggest_categorical
    settings:
      choices: [16, 32]
