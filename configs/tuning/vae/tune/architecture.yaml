study_name:
  vae_architecture

n_trials: 100

params:

  model.n_blocks_encoder:
    suggest: suggest_int
    settings:
      low: 2
      high: 4

  model.n_blocks_decoder:
    suggest: suggest_int
    settings:
      low: 2
      high: 4

  model.n_dense:
    suggest: suggest_categorical
    settings:
      choices: [64, 128, 256]

  model.batch_norm_momentum:
    suggest: suggest_float
    settings:
      low: 0.001
      high: 0.2
      log: true
