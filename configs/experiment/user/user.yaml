# User settings

seed: 42

# Options for training efficiency
device: auto  # the available accelerator
n_workers: 0
n_subprocesses: 0
lazy_load: true
on_the_fly: false
checkpoint_every: 100
load: 0  # -1 loads the latest checkpoint
run_id: null # run to resume, null resumes the last run

# Optional trackers for monitoring the experiment
trackers:
  hydra: true
  tensorboard: true
  wandb: false
  sqlalchemy: false
  csv: true
  matplotlib: false  # saves the figures of the metrics
  plotly: false  # saves the figures of the metrics
  pyvista: true

# Options for random generation
generate:
  batch_size: 8
  bias_dim: 0
  bias_value: 0.
  tour_samples_per_plane: 16
  tour_radius: 1.0
  z_max: 2.0
  z_std: 0.9

# Options for visualization
plot:
  interactive: false
  sample_indices: []
  use_train: false
  use_mean_shape: true
  interpolation_step_factor: 0.3
  interpolation_steps: 4
  num_eigenvectors: 10
  show: false  # also display the learning curves of the plotting trackers
