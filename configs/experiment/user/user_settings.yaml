# User settings

seed: 42

# Options for training efficiency
cpu: false
n_workers: 0
n_subprocesses: 0
lazy_load: true
on_the_fly: false
checkpoint_every: 100
load_checkpoint: 0

# Optional trackers for monitoring the experiment
trackers:
  hydra: true
  tensorboard: true
  wandb: false
  sqlalchemy: false
  csv: true

# Options for random generation
generate:
  batch_size: 8
  bias_dim: 0
  bias_value: 0.
  tour_samples_per_plane: 16
  tour_radius: 1.0

# Options for visualization
plot:
  interactive: false
  sample_indices: []
  use_train: false
  interpolation_step_factor: 0.3
  interpolation_steps: 4
  num_eigenvectors: 5
