# User settings

seed: 42

# Options for training efficiency
cpu: false
n_workers: 0
n_subprocesses: 0
on_the_fly: false
checkpoint_every: 100
load_checkpoint: 0

# Optional trackers for monitoring the experiment
trackers:
  hydra: true
  tensorboard: true
  wandb: false
  sqlalchemy: false
  csv: true

# Options for random generation
generate:
  batch_size: 8
  bias_dim: 0
  bias_value: 0.
  tour_samples: 100
  tour_radius: 1.0

# Options for visualization
plot:
  interactive: false
  sample_indices: [36, 168, 325, 496, 716, 909, 1054, 1231, 1404, 1578, 1741, 1917]
  use_train: false
  interpolation_step_factor: 0.3
  interpolation_steps: 4
  num_eigenvectors: 5
